<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reports · My Goat Farms Admin</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-page">
  <aside class="sidebar" id="sidebarRoot"></aside>

  <main class="admin-main">
    <header class="admin-top" id="topbarRoot"></header>

    <section class="panel">
      <div class="panel-head">
        <div><h2>Generate a Report</h2><p>Pick a report type and an optional date range, then download it as a CSV file.</p></div>
      </div>

      <div class="report-grid" id="reportTiles"></div>

      <div class="report-range">
        <div class="field">
          <label class="field-label" for="dateFrom">Date From</label>
          <input id="dateFrom" class="input" type="date">
        </div>
        <div class="field">
          <label class="field-label" for="dateTo">Date To</label>
          <input id="dateTo" class="input" type="date">
        </div>
        <button id="generateBtn" class="btn btn-primary" type="button" disabled>Generate Report</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead id="previewHead"></thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="../assets/js/reports.js"></script>
</body>
</html>
