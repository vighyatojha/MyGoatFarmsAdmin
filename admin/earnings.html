<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Earnings · My Goat Farms Admin</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-page">
  <aside class="sidebar" id="sidebarRoot"></aside>

  <main class="admin-main">
    <header class="admin-top" id="topbarRoot"></header>

    <section class="summary-grid" aria-label="Summary">
      <div class="summary-card">
        <div class="summary-card-header"><span>Total Earnings</span><div class="icon-chip teal"><svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div></div>
        <strong id="statTotal">₹0</strong><small>All time, paid payments</small>
      </div>
      <div class="summary-card">
        <div class="summary-card-header"><span>This Month</span><div class="icon-chip"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div>
        <strong id="statMonth">₹0</strong><small>Current calendar month</small>
      </div>
      <div class="summary-card">
        <div class="summary-card-header"><span>This Year</span><div class="icon-chip orange"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div></div>
        <strong id="statYear">₹0</strong><small>Since 1 January</small>
      </div>
      <div class="summary-card">
        <div class="summary-card-header"><span>Paid Payments</span><div class="icon-chip purple"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div></div>
        <strong id="statCount">0</strong><small>Successful transactions</small>
      </div>
    </section>

    <section class="panel" style="margin-bottom:24px;">
      <div class="panel-head"><div><h2>Revenue by Month</h2><p>Last 12 months, calculated from payment records.</p></div></div>
      <div class="bars" id="monthBars" style="padding:22px 26px;"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><div><h2>Revenue by Plan</h2><p>Which subscription plans bring in the most.</p></div></div>
      <div class="bars" id="planBars" style="padding:22px 26px;"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/assets/js/earnings.js"></script>
</body>
</html>
