<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login · My Goat Farms</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <a class="brand auth-brand" href="/">
      <span class="logo-ring lg"><img src="../assets/img/logo.png" alt="" width="48" height="48"></span>
      <span class="brand-name brand-lg">My Goat Farms</span>
    </a>

    <div class="auth-card">
      <span class="eyebrow">ADMIN PORTAL</span>
      <h1>Welcome back</h1>
      <p>Sign in to manage My Goat Farms.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email Address</label>
          <input id="email" class="input" type="email" autocomplete="username" required>
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <div class="input-wrap">
            <input id="password" class="input has-action" type="password" autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="input-action" aria-label="Show password" aria-pressed="false">
              <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="form-error" role="alert"></div>

        <button id="loginBtn" class="btn btn-primary btn-full" type="submit">Sign in</button>
      </form>
    </div>

    <a class="back-link" href="/">← Back to main website</a>
  </div>

  <script type="module" src="../assets/js/admin-login.js"></script>
</body>
</html>
